name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the engine checks need neither CmdStan nor the plotting stack
      - name: Install
        run: python -m pip install --upgrade pip numpy scipy pandas pytest

      - name: Check that the shipped data set is the one the paper analyses
        run: |
          python - <<'PY'
          from campyevo.data import find_dataset, load_dataset
          cd = load_dataset(find_dataset("data"))
          assert (cd.n_strains, cd.n_curves, len(cd.table)) == (50, 150, 1276), (
              cd.n_strains, cd.n_curves, len(cd.table))
          print("50 strains, 150 curves, 1276 plate counts")
          PY

      - name: Engine checks
        run: python -m pytest tests -q
